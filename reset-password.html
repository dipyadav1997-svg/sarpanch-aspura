<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Aspura</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

</head>


<body>

<header class="header">

    <div class="logo-area">

        <div class="village-icon">🏡</div>

        <div>
            <h1>ASPURA</h1>
            <p>सरपंच उम्मीदवार सूचना पोर्टल</p>
        </div>

    </div>

</header>


<main class="form-container">

    <div class="form-card">

        <h2>🔑 नया Password बनाएं</h2>

        <p class="form-intro">
            अपना नया password दर्ज करें।
        </p>


        <form id="resetForm">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="New password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="submit-btn"
                id="resetBtn">

                Password Update करें

            </button>

        </form>


        <div id="message"></div>

    </div>

</main>


<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


document
    .getElementById("resetForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const resetBtn =
            document.getElementById("resetBtn");

        const message =
            document.getElementById("message");


        if (password !== confirmPassword) {

            message.innerHTML = `
                <div class="error-box">
                    ❌ दोनों passwords समान नहीं हैं।
                </div>
            `;

            return;
        }


        if (password.length < 6) {

            message.innerHTML = `
                <div class="error-box">
                    ❌ Password कम से कम 6 characters का होना चाहिए।
                </div>
            `;

            return;
        }


        resetBtn.disabled = true;
        resetBtn.textContent = "Updating...";


        try {

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });


            if (error) {
                throw error;
            }


            message.innerHTML = `
                <div class="success-box">
                    ✅ आपका password successfully update हो गया है।
                    <br><br>
                    अब आप नए password से login कर सकते हैं।
                    <br><br>
                    <button
                        class="secondary-btn"
                        onclick="window.location.href='login.html'">
                        Login करें
                    </button>
                </div>
            `;


            resetBtn.style.display = "none";


        } catch (error) {

            console.error(error);

            message.innerHTML = `
                <div class="error-box">
                    ❌ Password update नहीं हो सका।
                    कृपया reset link से दोबारा प्रयास करें।
                </div>
            `;

            resetBtn.disabled = false;
            resetBtn.textContent = "Password Update करें";
        }

    });

</script>

</body>
</html>
