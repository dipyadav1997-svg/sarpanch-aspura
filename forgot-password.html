<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Aspura</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

</head>


<body>

<header class="header">

    <div class="logo-area">

        <div class="village-icon">🏡</div>

        <div>
            <h1>ASPURA</h1>
            <p>सरपंच उम्मीदवार सूचना पोर्टल</p>
        </div>

    </div>

</header>


<main class="form-container">

    <div class="form-card">

        <h2>🔐 Forgot Password</h2>

        <p class="form-intro">
            अपने registered email address पर
            password reset link प्राप्त करें।
        </p>


        <form id="forgotForm">

            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >


            <button
                type="submit"
                class="submit-btn"
                id="sendBtn">

                Reset Link भेजें

            </button>

        </form>


        <div id="message"></div>


        <div class="register-link">

            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='login.html'">

                ← वापस Login

            </button>

        </div>

    </div>

</main>


<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


document
    .getElementById("forgotForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const sendBtn =
            document.getElementById("sendBtn");

        const message =
            document.getElementById("message");


        sendBtn.disabled = true;
        sendBtn.textContent = "भेजा जा रहा है...";

        message.innerHTML = "";


        try {

            const redirectUrl =
                window.location.origin +
                window.location.pathname
                    .replace("forgot-password.html", "reset-password.html");


            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: redirectUrl
                    }
                );


            if (error) {
                throw error;
            }


            message.innerHTML = `
                <div class="success-box">
                    ✅ Password reset link आपके email पर भेज दिया गया है।
                    <br><br>
                    अपना email inbox और Spam/Junk folder भी check करें।
                </div>
            `;


        } catch (error) {

            console.error(error);

            message.innerHTML = `
                <div class="error-box">
                    ❌ Reset link भेजने में समस्या हुई।
                    कृपया email address check करें।
                </div>
            `;

        }


        sendBtn.disabled = false;
        sendBtn.textContent = "Reset Link भेजें";

    });

</script>

</body>
</html>
